name: proof

on:
  pull_request:

permissions:
  contents: write        # push the mp4 to the proof-videos branch
  pull-requests: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Replays the proof in a fresh browser; video:"on" saves a .webm per test.
      - run: npm run test:e2e

      # Always upload evidence, even on failure — a failing proof is still reviewable.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-video
          path: |
            test-results/**/video.webm
            playwright-report/

      # Publish an inline-playable video: convert webm -> mp4, push to an orphan
      # branch, and embed via jsDelivr (serves GitHub files with correct MIME).
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          pr="${{ github.event.pull_request.number }}"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status=${{ job.status == 'success' && '"✅ Proof passed."' || '"❌ Proof failed."' }}

          webm=$(find test-results -name video.webm | head -n1 || true)
          embed=""
          if [ -n "$webm" ]; then
            sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
            ffmpeg -y -i "$webm" -movflags +faststart -pix_fmt yuv420p proof.mp4

            branch=proof-videos
            path="pr-$pr/proof.mp4"
            tmp=$(mktemp -d)
            git clone --depth 1 --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$tmp" \
              || { git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$tmp"; git -C "$tmp" checkout --orphan "$branch"; git -C "$tmp" rm -rf . >/dev/null 2>&1 || true; }
            mkdir -p "$tmp/pr-$pr"
            cp proof.mp4 "$tmp/$path"
            git -C "$tmp" config user.name  "github-actions[bot]"
            git -C "$tmp" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$tmp" add "$path"
            git -C "$tmp" commit -m "proof video for PR #$pr (run ${{ github.run_id }})" >/dev/null
            git -C "$tmp" push origin "$branch"

            sha=$(git -C "$tmp" rev-parse HEAD)
            embed="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${sha}/${path}"
          fi

          {
            echo "### Proof replay"
            echo ""
            echo "$status"
            echo ""
            if [ -n "$embed" ]; then
              echo "<video src=\"$embed\" controls width=\"640\"></video>"
              echo ""
              echo "_Video not playing? [Open the run]($run) and download the \`proof-video\` artifact._"
            else
              echo "⚠️ No proof video was produced. [See the run]($run)."
            fi
          } > body.md
          gh pr comment "$pr" --body-file body.md
