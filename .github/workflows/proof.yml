name: proof

on:
  pull_request:

permissions:
  contents: write        # push the mp4 to the proof-videos branch
  pull-requests: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Replays the proof in a fresh browser; video:"on" saves a .webm per test.
      - run: npm run test:e2e

      # Always upload evidence, even on failure — a failing proof is still reviewable.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-video
          path: |
            test-results/**/video.webm
            playwright-report/

      # Publish an inline-playable video: convert webm -> mp4 and upload it as a
      # Release asset (a GitHub-hosted URL, the best shot at inline <video>).
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          pr="${{ github.event.pull_request.number }}"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status=${{ job.status == 'success' && '"✅ Proof passed."' || '"❌ Proof failed."' }}

          webm=$(find test-results -name video.webm | head -n1 || true)
          dl=""
          if [ -n "$webm" ]; then
            sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
            ffmpeg -y -i "$webm" -movflags +faststart -pix_fmt yuv420p proof.mp4

            tag="proof-videos"
            asset="pr-${pr}-run-${{ github.run_id }}.mp4"
            mv proof.mp4 "$asset"
            gh release view "$tag" >/dev/null 2>&1 \
              || gh release create "$tag" --title "Proof videos" --notes "Automated proof replay videos." --prerelease
            gh release upload "$tag" "$asset" --clobber
            dl="${{ github.server_url }}/${{ github.repository }}/releases/download/${tag}/${asset}"
          fi

          {
            echo "### Proof replay"
            echo ""
            echo "$status"
            echo ""
            if [ -n "$dl" ]; then
              # Bare release-asset URL — GitHub auto-embeds a player for hosted video.
              echo "$dl"
              echo ""
              echo "_Not playing inline? [Download the video]($dl) or [open the run]($run)._"
            else
              echo "⚠️ No proof video was produced. [See the run]($run)."
            fi
          } > body.md
          gh pr comment "$pr" --body-file body.md
