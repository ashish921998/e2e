name: proof

# Reference workflow — this repo's own PRs are the live demo, and this file is
# copy-paste documentation for adopting e2e-proof in any web repo.
#
# Two install modes are shown:
#   (A) deployment_status — the default, drop-in path for Vercel/Netlify/etc.
#       It fires when the PR's preview finishes deploying and reads that URL
#       from the event. Uncomment the trigger below to use it.
#   (B) pull_request — used here so the demo runs against a preview booted
#       in-CI (`npm run dev:local`) without an external deploy host.
#
# Install in your repo:
#   1. Add this file as .github/workflows/e2e-proof.yml
#   2. Add secrets E2B_API_KEY + OPENAI_API_KEY (GPT-5.6 is the default model;
#      ANTHROPIC_API_KEY selects Claude instead).
#   3. Reference the published action: uses: ashish921998/e2e@v1

on:
  pull_request:
  # deployment_status:   # ← uncomment for the zero-config preview path (A)
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (manual demo run)"
        required: true

permissions:
  contents: write        # upload the video Release asset
  pull-requests: write   # post the verdict comment

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo's persistent deployment is the demo target. Consumers pass
      # their own preview URL or use deployment_status auto-detection.
      - name: Run e2e-proof
        uses: ./
        with:
          base-url: ${{ github.event.inputs.url || 'https://e2e-five-kappa.vercel.app/' }}
          goal: "Verify the Vintage Camera product page shows the low-stock warning."
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
