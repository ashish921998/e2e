name: proof

# Reference workflow — this repo's own PRs are the live demo, and this file is
# copy-paste documentation for adopting e2e-proof in any web repo.
#
# Two install modes are shown:
#   (A) deployment_status — the default, drop-in path for Vercel/Netlify/etc.
#       It fires when the PR's preview finishes deploying and reads that URL
#       from the event. Uncomment the trigger below to use it.
#   (B) pull_request — used here so the demo runs against a preview booted
#       in-CI (`npm run dev:local`) without an external deploy host.
#
# Install in your repo:
#   1. Add this file as .github/workflows/e2e-proof.yml
#   2. Add secrets E2B_API_KEY + OPENAI_API_KEY (GPT-5.6 is the default model;
#      ANTHROPIC_API_KEY selects Claude instead).
#   3. Reference the published action: uses: ashish921998/e2e@v1

on:
  pull_request:
  # deployment_status:   # ← uncomment for the zero-config preview path (A)
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (manual demo run)"
        required: true

permissions:
  contents: write        # upload the video Release asset
  pull-requests: write   # post the verdict comment

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Demo mode only: boot this repo's app in CI and give the remote E2B
      # browser a public URL. Runner localhost is not visible inside E2B.
      # Adopters with a preview host delete this and trigger on deployment_status.
      - name: Boot the demo app (CI preview)
        id: app
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          ( __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.trycloudflare.com \
            npm run dev:local -- --port 4173 --host 127.0.0.1 >/tmp/app.log 2>&1 & )
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break || sleep 1
          done

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:4173 > /tmp/cloudflared.log 2>&1 &

          url=""
          for i in $(seq 1 60); do
            url=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            [ -n "$url" ] && curl -sf "$url" >/dev/null && break
            sleep 1
          done
          if [ -z "$url" ]; then
            cat /tmp/cloudflared.log
            echo "::error::Cloudflare quick tunnel did not become ready"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The reusable action does: resolve URL → E2B sandbox + agent → replay →
      # upload artifacts → post verdict + video. `base-url` is explicit here
      # (CI preview); omit it to auto-detect from a deployment_status event.
      - name: Run e2e-proof
        uses: ./
        with:
          base-url: ${{ github.event.inputs.url || steps.app.outputs.url }}
          goal: "Verify the Vintage Camera product page shows the low-stock warning."
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # GPT-5.6 (default model — the Build Week path)
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # alternative: Claude Opus 4.8
